# Publica una versión del programa a partir de una rama "subir/vX.Y.Z".
# La rama lleva en release/ los archivos grandes partidos en trozos (GitHub no admite archivos de
# más de 100 MB en git): el instalador de Windows y los .zip de Mac; además latest.yml (Windows),
# latest-mac.yml (Mac), el .blockmap y NOTAS.md. Los trozos se pueden subir en varios envíos: el
# flujo solo actúa cuando aparece release/LISTO. Entonces une los trozos, comprueba el SHA-512 de
# cada archivo con latest.yml y latest-mac.yml, crea la release y borra las ramas de subida.
name: Publicar versión

on:
  push:
    branches: ['subir/**']

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la subida está completa
        id: listo
        run: |
          if [ -f release/LISTO ]; then echo "si=1" >> "$GITHUB_OUTPUT"; else echo "Faltan archivos por subir: se espera a release/LISTO"; fi

      - name: Unir los archivos y comprobarlos
        if: steps.listo.outputs.si == '1'
        id: unir
        run: |
          set -euo pipefail
          cd release
          # Unir cada archivo partido en trozos (instalador de Windows y .zip de Mac)
          for base in $(ls | grep -E '\.part[0-9]+$' | sed -E 's/\.part[0-9]+$//' | sort -u); do
            cat $(ls "$base".part* | sort -V) > "$base"
            rm "$base".part*
          done
          # Cada archivo que anuncian latest.yml (Windows) y latest-mac.yml (Mac) tiene que coincidir
          for yml in latest.yml latest-mac.yml; do
            [ -f "$yml" ] || continue
            paste -d' ' <(sed -n 's/^  - url: //p' "$yml") <(sed -n 's/^    sha512: //p' "$yml") | while read -r f esperado; do
              real=$(openssl dgst -sha512 -binary "$f" | base64 -w0)
              if [ "$esperado" != "$real" ]; then echo "$f no coincide con $yml"; exit 1; fi
              echo "ok $f"
            done
          done
          # Vale con solo uno de los dos (una versión puede subirse primero para Mac y después para Windows)
          version=$(cat latest*.yml | sed -n 's/^version: //p' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Crear la release
        if: steps.listo.outputs.si == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd release
          v="v${{ steps.unir.outputs.version }}"
          archivos=$(ls | grep -v -x -e NOTAS.md -e LISTO)
          if gh release view "$v" >/dev/null 2>&1; then
            gh release upload "$v" $archivos --clobber
          else
            gh release create "$v" $archivos --target main --title "Discord Bot Builder ${{ steps.unir.outputs.version }}" --notes-file NOTAS.md
          fi

      - name: Borrar las ramas de subida
        if: success() && steps.listo.outputs.si == '1'
        run: |
          git push origin --delete "$GITHUB_REF_NAME"
          for rama in $(git ls-remote --heads origin 'trozos/*' | awk '{print $2}' | sed 's#refs/heads/##'); do git push origin --delete "$rama" || true; done
